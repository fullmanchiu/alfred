version: '3.8'

services:
  py-service:
    image: alfred-py-service:latest
    container_name: py-service
    restart: unless-stopped
    ports:
      - "${PY_SERVICE_PORT:-8001}:8001"
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      # 代码目录（包含 environment.yml）
      - ./app:/app
      # 数据目录
      - ./data:/app/data
      # 日志目录
      - ./logs:/app/logs
    environment:
      - PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Java 后端地址
      - JAVA_BASE_URL=http://backend:8080
    networks:
      - alfred-network
    healthcheck:
      test: ["CMD", "micromamba", "run", "-n", "base", "python", "-c", "import requests; requests.get('http://localhost:8001/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  alfred-network:
    name: alfred-network
    external: true
