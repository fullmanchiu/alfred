name: py-service
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.13
  - pip

  # Conda 包（仅限需要 C 库的）
  - ta-lib

  # Pip 包（所有其他包）
  - pip:
      # Web框架
      - fastapi
      - uvicorn[standard]
      - pydantic
      - python-multipart

      # 数据处理
      - pandas
      - numpy

      # 可视化
      - plotly

      # 数据库
      - psycopg2-binary

      # 工具
      - python-dotenv

      # 数据源
      - akshare
      - baostock
