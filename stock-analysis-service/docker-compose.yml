# 股票分析微服务 Docker Compose 配置
# 用于本地开发和测试

version: '3.8'

services:
  stock-analysis-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis-service
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - PORT=8001
      - LOG_LEVEL=INFO
    networks:
      - alfred-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  alfred-network:
    external: true
